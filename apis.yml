name: CAMP4 Therapeutics
description: >-
  CAMP4 Therapeutics is a clinical-stage RNA-medicines biotechnology company based in
  Cambridge, Massachusetts, pioneering a new class of antisense oligonucleotide (ASO)
  therapeutics designed to increase targeted gene expression. Built on the company's
  RAP Platform (Regulatory RNA Activating Platform), which combines epigenomics,
  computational biology, and machine learning to map the regulatory RNA and signaling
  circuits controlling gene expression, CAMP4 develops first-in-class medicines for
  diseases caused by insufficient protein expression, with an initial focus on central
  nervous system and metabolic disorders such as urea cycle disorders and SYNGAP1.
  Founded by CEO Josh Mandel-Brehm with scientific co-founders Rick Young (Whitehead
  Institute/MIT) and Len Zon (Boston Children's Hospital/Harvard), CAMP4 is backed by
  Andreessen Horowitz (a16z). This is a corporate/therapeutics company profile in the
  API Evangelist network; CAMP4 publishes no public developer API, OpenAPI, or
  developer portal, so no API artifacts apply.
